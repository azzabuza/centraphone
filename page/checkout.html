<style>
.checkout {
box-sizing: border-box;
padding: 10px;
margin: 0;
text-align: left;
position: relative;
}
.checkout h2 {
font-size: 1.3rem;
font-weight: 600;
color: #090e11;
padding: 0;
margin: 10px;
}
.checkout-box {
box-sizing: border-box;
padding: 0;
margin: 0;
overflow: hidden;
}
.checkout-left {
width: 70%;
padding: 0;
margin: 0;
box-sizing: border-box;
justify-content: center;
}
.checkout-right {
width: 30%;
padding: 0;
margin: 0;
box-sizing: border-box;
justify-content: center;
}
.checkout-content {
box-sizing: border-box;
padding: 10px;
margin: 0;
overflow: hidden;
}
.checkout-content h3 {
margin-top: 0;
padding-bottom: 10px;
border-bottom: 1px solid #eee;
}

.form-group {
margin-bottom: 15px;
}

.form-group label {
display: block;
margin-bottom: 5px;
font-weight: 500;
}
.checkout-ipt {
  box-sizing: border-box;
  background-color: #ffffff;
  padding: 10px;
  margin: 0;
  display: flex;
  border-radius: 25px;
  border: 1px solid #dcdcdc;
}
.checkout-ipt svg {
  fill: #24323d;
}
.checkout-ipt svg.line,
.checkout-ipt svg .line {
  stroke: #24323d;
}
.checkout-ipt:hover {
  border: 1px solid #24323d;
}
.checkout-ipt input {
  box-sizing: border-box;
  display: inline-block;
  background-color: transparent;
  font-family: "Poppins", sans-serif;
  color: #132028;
  caret-color: #24323d;
  font-size: 1rem;
  padding: 0 0 0 10px;
  margin: 0;
  width: 100%;
  outline: none;
  border: none;
}
.checkout-ipt input::placeholder {
  color: #888888;
}


  

.checkout-summary table {
width: 100%;
border-collapse: collapse;
}

.checkout-summary table tr:not(:last-child) td {
padding-bottom: 10px;
}

.checkout-summary table td:last-child {
text-align: right;
}

.checkout-total {
font-weight: bold;
font-size: 1.2em;
border-top: 1px solid #eee;
padding-top: 10px;
}

.checkout-button {
display: block;
width: 100%;
padding: 15px;
background-color: #24323d;
color: white;
border: none;
border-radius: 4px;
font-size: 16px;
font-weight: bold;
cursor: pointer;
text-align: center;
transition: background-color 0.2s;
}

.checkout-button:hover {
background-color: #1a242b;
}

.checkout-button:disabled {
background-color: #ccc;
cursor: not-allowed;
}

@media (max-width: 768px) {
.checkout-box {
flex-direction: column;
}
}
</style>
</head>
<body>
<main
class="content-wrapper"
itemscope
itemtype="https://schema.org/WebPage"
>
<section class="header" id="header"></section>
<section class="checkout">
<h2>Checkout Order</h2>
<div class="checkout-box">
<div class="checkout-left">
<div class="checkout-content">

<form id="shipping-form">
<div class="form-group">
<label for="name">Full Name</label>
<div class="checkout-ipt">
<input type="text" id="name" name="name" required>
</div>
  </div>
<div class="form-group">
<label for="email">Email</label>
<div class="checkout-ipt">
<input type="email" id="email" name="email" required>
</div>
  </div>
<div class="form-group">
<label for="phone">Phone Number</label>
<div class="checkout-ipt">
<input type="tel" id="phone" name="phone" required>
</div>
  </div>
<div class="form-group">
<label for="address">Full Address</label>
<textarea id="address" name="address" rows="3" required></textarea>
</div>
<div class="form-group">
<label for="city">City</label>
<input type="text" id="city" name="city" required>
</div>
<div class="form-group">
<label for="province">Province</label>
<input type="text" id="province" name="province" required>
</div>
<div class="form-group">
<label for="postal">Postal Code</label>
<input type="text" id="postal" name="postal" required>
</div>
</form>
</div>
</div>
</div>
<div class="checkout-right">
<div class="checkout-section">
<h3>Order Summary</h3>
<div id="checkout-items"></div>
</div>

<div class="checkout-section checkout-summary">
<h3>Payment Summary</h3>
<table>
<tr><td>Subtotal</td> <td id="checkout-subtotal">0</td></tr>
<tr><td>Insurance</td> <td id="checkout-insurance">0</td></tr>
<tr><td>Packaging</td> <td id="checkout-packing">0</td></tr>
<tr><td>Shipping</td> <td id="checkout-shipping">0</td></tr>
<tr><td>Admin Fee</td> <td id="checkout-administration">0</td></tr>
<tr class="checkout-total"><td>Total</td> <td id="checkout-total">0</td></tr>
</table>
</div>

<div class="checkout-section">
<button id="place-order" class="checkout-button" disabled>Place Order</button>
</div>
</div>
</div>
</section>
<section class="footer" id="footer"></section>
<section class="mobile" id="mobile"></section>
</main>
<script type="text/javascript" src="../asset/js/checkout.js"></script>
<script type="text/javascript" src="../asset/js/global.js"></script>
</body>
</html>
